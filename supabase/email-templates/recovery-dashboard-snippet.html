<!-- 复制到 Supabase Dashboard → Authentication → Email Templates → Reset password -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; line-height: 1.7; color: #1f2937;">
  <h2 style="margin: 0 0 12px; color: #8b6b00;">重置你的密码</h2>
  <p style="margin: 0 0 12px;">我们收到了重置密码的请求。请点击下方按钮设置新密码（链接仅可使用一次）。</p>
  <p style="margin: 18px 0;">
    <a
      href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery"
      style="display:inline-block;padding:10px 18px;border-radius:8px;background:#c79b2b;color:#ffffff;text-decoration:none;font-weight:600;"
    >
      重置密码
    </a>
  </p>
  <p style="margin: 0 0 8px;">如在 QQ 邮箱内无法打开，请使用「在浏览器中打开」或复制链接到系统浏览器。</p>
  <p style="margin: 0 0 8px;">如果这不是你本人的操作，请忽略此邮件。</p>
  <p style="margin: 16px 0 0; color: #6b7280;">—— 海浪资讯</p>
</div>
